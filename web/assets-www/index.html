<!DOCTYPE html>
<!-- COMU Field Logs home screen by lambdadriver, v1.1. Offline; data stays on this device. -->
<html lang="en" data-theme="light" data-night="red">
<head>
<meta charset="utf-8">
<meta name="author" content="lambdadriver">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" id="metaTheme" content="#ffffff">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>COMU Field Logs</title>
<style>

:root{
  --bg:#f4f5f7;--panel:#fff;--text:#111;--muted:#5b6170;--line:#d4d7de;--accent:#0b5cad;--accent-text:#fff;
  --danger:#b3261e;--ok:#1d7a3a;--input:#fff;--chip:#e8eef7;--focus:#ffb300;
  --tap:48px;
}
html[data-theme="dark"]{
  --bg:#0d0f12;--panel:#171a1f;--text:#e9e6df;--muted:#9aa0aa;--line:#2c313a;--accent:#c0392b;--accent-text:#fff;
  --danger:#ff6b5e;--ok:#5fd18a;--input:#0f1215;--chip:#262a31;--focus:#ffb300;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%;padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
button{min-height:var(--tap);min-width:var(--tap);padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:600}
button.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
button.danger{color:var(--danger);border-color:var(--danger)}
button.ghost{background:transparent;border-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--focus);outline-offset:1px}
input,select,textarea{min-height:var(--tap);width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--input)}
textarea{resize:vertical;min-height:72px}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:0 0 4px}
.wrap{max-width:1100px;margin:0 auto;padding:12px}
header.bar{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
header.bar .wrap{display:flex;gap:8px;align-items:center;padding:8px 12px}
header.bar h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;max-width:1100px;margin:0 auto}
nav.tabs button{flex:0 0 auto}
nav.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.card h2{font-size:16px;margin:0 0 10px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.row>*{flex:1 1 auto}
.muted{color:var(--muted)}
.small{font-size:13px}
.hidden{display:none!important}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600}
.loglist .item{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--panel)}
.loglist .item .info{flex:1;min-width:0;cursor:pointer}
.loglist .item .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qa{position:sticky;top:var(--hdr,64px);z-index:10}
.qa .times{display:grid;grid-template-columns:minmax(0,1fr) 110px auto;gap:8px;align-items:end}
.qa .times>div{min-width:0}
.qa .nowbtn{background:var(--ok);color:#fff;border-color:var(--ok);min-width:90px;font-size:18px}
html[data-theme="dark"] .qa .nowbtn{color:#000}
.qa .addrow{display:flex;gap:8px;margin-top:8px;align-items:stretch}
.qa .addrow textarea{flex:1;min-height:var(--tap)}
.qa .addrow button{min-width:96px;font-size:18px}
.entries .e{display:grid;grid-template-columns:96px 1fr auto;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);align-items:start}
.entries .e .dt{font-variant-numeric:tabular-nums;font-weight:700}
.entries .e .dt small{display:block;font-weight:400;color:var(--muted)}
.entries .e .txt{white-space:pre-wrap;word-break:break-word}
.entries .e .acts{display:flex;gap:4px}
.entries .e .acts button{padding:0 10px}
table.res{width:100%;border-collapse:collapse}
table.res td,table.res th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:middle}
table.res input{min-height:40px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;z-index:100;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--text);max-width:560px;width:92vw;padding:16px}
dialog::backdrop{background:rgba(0,0,0,.5)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--chip);border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-size:28px;font-variant-numeric:tabular-nums}
table.sum{width:100%;border-collapse:collapse;font-size:14px}
table.sum th,table.sum td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left}
table.sum td.n,table.sum th.n{text-align:right;font-variant-numeric:tabular-nums}
table.sum th.sortable{cursor:pointer;user-select:none;white-space:nowrap}
table.sum tbody tr.click{cursor:pointer}
.scroll{overflow-x:auto}
footer.by{text-align:center;color:var(--muted);font-size:12px;padding:16px 0 28px}
.warn{background:#fff3cd;color:#5c4400;border:1px solid #e0c060;border-radius:10px;padding:10px;margin-bottom:12px}
@media (max-width:600px){
  .qa .times{grid-template-columns:minmax(0,1fr) 84px 80px}
  .qa .times input{min-width:0;padding:10px 8px}
  .qa .nowbtn{min-width:0;padding:0 6px}
  .entries .e{grid-template-columns:72px 1fr}
  .entries .e .acts{grid-column:1 / -1;justify-content:flex-end}
  .stats b{font-size:22px}
  header.bar h1{font-size:16px}
}


/* ---------- My Info ---------- */
.mi-dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;margin:0}
.mi-dl dt{color:var(--muted);font-size:13px;font-weight:600}
.mi-dl dd{margin:0;white-space:pre-wrap;word-break:break-word;font-weight:600}
.mi-empty{color:var(--muted);font-style:italic}
.mi-grid{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
@media (max-width:600px){.mi-dl{grid-template-columns:1fr}.mi-dl dd{margin-bottom:6px}}
.tzb{display:inline-block;font-size:11px;font-weight:800;padding:0 5px;border-radius:5px;border:1.5px solid currentColor;margin-left:5px;vertical-align:1px;color:var(--accent)}
.tzb.hidden{display:none!important}
.lastline{margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;color:var(--muted)}
.lastline b{color:var(--text)}
.endrow{display:flex;justify-content:flex-end;margin-top:6px}
.endrow button{min-height:40px;font-size:14px}
html.field .endrow button{min-height:56px;font-size:17px}
#aboutBody{margin:6px 0 0;padding-left:18px;font-size:14px;color:var(--muted)}
#aboutBody li{margin:3px 0}
/* ---------- FIELD MODE: gloves-friendly ---------- */
html.field{--tap:64px}
html.field body{font-size:19px}
html.field label{font-size:15px}
html.field button{font-size:18px;border-width:2px}
html.field .qa .nowbtn{min-width:120px;font-size:24px}
html.field .qa .addrow button{min-width:130px;font-size:24px}
html.field .qa .times{grid-template-columns:minmax(0,1fr) 130px auto}
html.field .qa .addrow textarea{min-height:96px;font-size:20px}
html.field input,html.field select,html.field textarea{font-size:19px}
html.field input[type="checkbox"]{width:30px!important;height:30px!important;min-height:30px!important}
html.field .entries .e .acts button{min-width:64px;padding:0 14px}
html.field nav.tabs button{font-size:17px}
@media (max-width:600px){
  html.field .qa .times{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  html.field .qa .times>div:first-child{grid-column:1 / -1}
  html.field .qa .nowbtn{min-width:0;font-size:22px}
  html.field .qa .addrow{flex-direction:column}
  html.field .qa .addrow button{min-height:72px;width:100%}
  html.field .entries .e{grid-template-columns:80px 1fr}
}
.toggle{display:flex;gap:12px;align-items:flex-start;margin:10px 0;font-weight:600;color:var(--text);font-size:16px}
.toggle input{width:26px;height:26px;min-height:26px;flex:0 0 auto;margin-top:2px}
.toggle.sub{margin-left:38px}
.toggle.sub.off{opacity:.45}
.gps .pin,.small .pin{vertical-align:-1px;margin-right:3px}.entries .e .gps{display:block;margin-top:2px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.toggle .small{display:block;font-weight:400;color:var(--muted)}
.beta{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.06em;padding:0 5px;border-radius:5px;border:1.5px solid currentColor;margin-left:6px;vertical-align:2px;color:var(--accent);line-height:1.5}
/* last-event ticker: very top of the app, one line */
.ticker{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;line-height:20px;padding:3px 12px;color:var(--muted);border-bottom:1px solid var(--line);max-width:1100px;margin:0 auto}
.ticker b{color:var(--text)}
html.field .ticker{font-size:16px;line-height:24px}
/* Easter egg menu (About) */
#aboutVer{cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#eggMenu{margin-top:12px;padding:10px 12px;border:1px dashed var(--line);border-radius:12px}
#eggMenu h3{margin:0 0 4px;font-size:14px}
#eggMenu .toggle{margin:8px 0}
#eggMenu .eggfoot{display:flex;justify-content:flex-end}
#eggHide{color:var(--accent);font-size:13px;font-weight:600;background:none;border:none;min-height:32px;min-width:0;padding:0 4px;text-decoration:underline;cursor:pointer}
/* ---------- EASTER EGG MODES: screen only, never print ---------- */
@media screen{
  html[data-egg="cotton"]{--bg:#ffe6f4;--panel:#ffffff;--text:#24102e;--muted:#4a2f5c;--line:#ff9fd2;--accent:#c4127a;--accent-text:#fff;--danger:#b3122e;--ok:#1d7a3a;--input:#fff;--chip:#d2eeff;--focus:#0091ff}
  html[data-egg="cotton"] body{background:linear-gradient(135deg,#ff8fcf 0%,#ffc2e6 30%,#b5e4ff 70%,#7fcfff 100%);background-attachment:fixed}
  html[data-egg="cotton"] header.bar{background:linear-gradient(90deg,#ff7cc6,#ffb3df 45%,#a6e0ff 55%,#62c4ff);border-bottom:2px solid #ff4fb0}
  html[data-egg="cotton"] header.bar h1{color:#24102e}
  html[data-egg="cotton"] header.bar h1::after{content:" \1F36C\2601\FE0F";font-size:.9em}
  html[data-egg="cotton"] .ticker{color:#24102e;background:rgba(255,255,255,.55);border-bottom-color:#ff9fd2}
  html[data-egg="cotton"] .ticker b{color:#24102e}
  html[data-egg="cotton"] .card{border:2px solid transparent;background:linear-gradient(var(--panel),var(--panel)) padding-box,linear-gradient(120deg,#ff4fb0,#ff9fd2 40%,#7fcfff 60%,#1fa8ff) border-box;box-shadow:0 3px 12px rgba(255,79,176,.22)}
  html[data-egg="cotton"] button{background:#fff;border-color:#ff9fd2}
  html[data-egg="cotton"] button.primary{background:linear-gradient(135deg,#d0157f,#b0106a);border-color:#b0106a;color:#fff}
  html[data-egg="cotton"] nav.tabs button[aria-selected="true"]{background:linear-gradient(180deg,#8ed6ff,#55bdf7);border-color:#2fa6ee;color:#0b2236}
  html[data-egg="cotton"] button.danger{color:#b3122e;border-color:#b3122e}
  html[data-egg="cotton"] button.ghost{background:transparent;border-color:transparent}
  html[data-egg="cotton"] .qa .nowbtn{background:linear-gradient(180deg,#1d7a3a,#17652f);border-color:#17652f;color:#fff}
  html[data-egg="cotton"] input[type="checkbox"]{accent-color:#d0157f}
  html[data-egg="brewers"]{--bg:#f3f0e4;--panel:#fffbf0;--text:#12284b;--muted:#45536d;--line:#d8cca8;--accent:#12284b;--accent-text:#ffc52f;--danger:#a4231b;--ok:#1d6b34;--input:#fff;--chip:#f4e7c0;--focus:#ffc52f}
  html[data-egg="brewers"] body{background:repeating-linear-gradient(90deg,#e7f1de 0 56px,#dbe9cf 56px 112px);background-attachment:fixed}
  html[data-egg="brewers"] header.bar{background:#12284b;border-bottom:4px solid #ffc52f;color:#fff}
  html[data-egg="brewers"] header.bar h1{color:#ffc52f}
  html[data-egg="brewers"] header.bar h1::before{content:"\26BE  ";font-size:.9em}
  html[data-egg="brewers"] header.bar button{background:#1c3766;color:#ffc52f;border-color:#ffc52f}
  html[data-egg="brewers"] header.bar button.ghost{background:transparent;border-color:transparent}
  html[data-egg="brewers"] .ticker{color:#e8ecf4;border-bottom-color:#2a4673;background:#0c1d38}
  html[data-egg="brewers"] .ticker b{color:#ffc52f}
  html[data-egg="brewers"] .card{border:2px solid #12284b;box-shadow:inset 0 4px 0 #ffc52f}
  html[data-egg="brewers"] .loglist .item{border-color:#12284b;border-left:5px solid #ffc52f}
  html[data-egg="brewers"] button.primary,html[data-egg="brewers"] nav.tabs button[aria-selected="true"]{background:#12284b;color:#ffc52f;border-color:#12284b}
  html[data-egg="brewers"] nav.tabs button{border-color:#12284b}
  html[data-egg="brewers"] .qa .nowbtn{background:#1d6b34;border-color:#1d6b34;color:#fff}
  html[data-egg="brewers"] .entries .e{border-bottom:1px dashed #c8102e}
  html[data-egg="brewers"] input[type="checkbox"]{accent-color:#12284b}
  html[data-egg="brewers"] footer.by{color:#2c3a55}
}
/* ---------- NIGHT VISION (red) : screen only ---------- */
html[data-theme="night"]{
  --bg:#000;--panel:#000;--text:#e01b1b;--muted:#b00000;--line:#560000;--accent:#a00000;--accent-text:#000;
  --danger:#ff3030;--ok:#b00000;--input:#000;--chip:#1c0000;--focus:#ff3030;
  color-scheme:dark;accent-color:#b00000;
}
@media screen{
  html[data-theme="night"],html[data-theme="night"] body{background:#000;color:var(--text)}
  html[data-theme="night"] *{scrollbar-color:#560000 #000;-webkit-tap-highlight-color:rgba(160,0,0,.35)}
  html[data-theme="night"] ::selection{background:#600000;color:#ff3030}
  html[data-theme="night"] button{background:#000;color:var(--text);border-color:#700000}
  html[data-theme="night"] button.primary,html[data-theme="night"] nav.tabs button[aria-selected="true"]{background:#a00000;color:#000;border-color:#a00000}
  html[data-theme="night"] button.danger{color:#ff3030;border-color:#a00000;background:#000}
  html[data-theme="night"] button.ghost{background:transparent;border-color:transparent}
  html[data-theme="night"] .qa .nowbtn{background:#280000;color:#ff3030;border-color:#b00000}
  html[data-theme="night"] input,html[data-theme="night"] select,html[data-theme="night"] textarea{background:#000;color:var(--text);border-color:#600000;caret-color:#ff3030}
  html[data-theme="night"] ::placeholder{color:#7a0000;opacity:1}
  html[data-theme="night"] option,html[data-theme="night"] optgroup{background:#000;color:#e01b1b}
  html[data-theme="night"] input:-webkit-autofill{-webkit-text-fill-color:#e01b1b;-webkit-box-shadow:0 0 0 1000px #000 inset;caret-color:#ff3030}
  html[data-theme="night"] input[type="checkbox"],html[data-theme="night"] input[type="radio"]{accent-color:#b00000;-webkit-appearance:none;appearance:none;width:22px;height:22px;min-height:22px;padding:0;border:2px solid #b00000;border-radius:5px;background:#000;display:inline-grid;place-content:center;flex:0 0 auto}
  html[data-theme="night"] input[type="checkbox"]:checked::after{content:"";width:11px;height:6px;border-left:3px solid #000;border-bottom:3px solid #000;transform:translateY(-2px) rotate(-45deg)}
  html[data-theme="night"] input[type="checkbox"]:checked{background:#b00000}
  html[data-theme="night"] ::-webkit-calendar-picker-indicator{filter:brightness(0) saturate(100%) invert(14%) sepia(97%) saturate(7400%) hue-rotate(358deg) brightness(92%);opacity:1;cursor:pointer}
  html[data-theme="night"] ::-webkit-datetime-edit,html[data-theme="night"] ::-webkit-datetime-edit-fields-wrapper{color:var(--text)}
  html[data-theme="night"] input::-webkit-datetime-edit-year-field,html[data-theme="night"] input::-webkit-datetime-edit-month-field,html[data-theme="night"] input::-webkit-datetime-edit-day-field,html[data-theme="night"] input::-webkit-datetime-edit-hour-field,html[data-theme="night"] input::-webkit-datetime-edit-minute-field,html[data-theme="night"] input::-webkit-datetime-edit-ampm-field{background-color:transparent;color:var(--text)}
  html[data-theme="night"] textarea::-webkit-resizer{background:linear-gradient(135deg,transparent 0 55%,#700000 55% 65%,transparent 65% 75%,#700000 75% 85%,transparent 85%)}
  html[data-theme="night"] ::-webkit-scrollbar{background:#000;width:10px;height:10px}
  html[data-theme="night"] ::-webkit-scrollbar-thumb{background:#4a0000;border-radius:5px}
  html[data-theme="night"] ::-webkit-scrollbar-corner{background:#000}
  html[data-theme="night"] ::-webkit-list-button{filter:brightness(0) saturate(100%) invert(14%) sepia(97%) saturate(7400%) hue-rotate(358deg)}
  html[data-theme="night"] button:focus-visible,html[data-theme="night"] input:focus-visible,html[data-theme="night"] select:focus-visible,html[data-theme="night"] textarea:focus-visible{outline:3px solid #ff3030;outline-offset:1px}
  html[data-theme="night"] a{color:#ff3030}
  html[data-theme="night"] .toast{background:#1c0000;color:#ff3030;border:1px solid #a00000}
  html[data-theme="night"] .warn{background:#1c0000;color:#ff3030;border-color:#a00000}
  html[data-theme="night"] dialog{background:#000;color:var(--text);border-color:#700000}
  html[data-theme="night"] dialog::backdrop{background:rgba(0,0,0,.8)}
  html[data-theme="night"] .tzb{color:#ff3030}
  html[data-theme="night"] .stat{background:#140000;border:1px solid #500000}
  html[data-theme="night"] .stat b{color:#ff3030}
  html[data-theme="night"] .chip{background:#1c0000;color:#e01b1b}
  html[data-theme="night"] img{filter:grayscale(1) sepia(1) saturate(8) hue-rotate(-50deg) brightness(.6)}
}

  html[data-theme="night"][data-night="green"] option,html[data-theme="night"][data-night="green"] optgroup{background:#000;color:#1bb81b}
  html[data-theme="night"][data-night="green"] input:-webkit-autofill{-webkit-text-fill-color:#1bb81b;-webkit-box-shadow:0 0 0 1000px #000 inset;caret-color:#30d130}
  html[data-theme="night"][data-night="green"] input[type="checkbox"],html[data-theme="night"][data-night="green"] input[type="radio"]{accent-color:#009000;-webkit-appearance:none;appearance:none;width:22px;height:22px;min-height:22px;padding:0;border:2px solid #009000;border-radius:5px;background:#000;display:inline-grid;place-content:center;flex:0 0 auto}
