<!-- T-Card Printer & Tracker by lambdadriver, v1.2-exp.2 (experimental side branch of v1.2). Copyright 2026 lambdadriver. GPL-3.0, no warranty; see the repository LICENSE. Offline single-file tool; data stays on this device. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="author" content="lambdadriver">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" id="metaTheme" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="T-Cards">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>T-Card Tracker v1.2-exp.2</title>
<style>
:root{
  --bg:#f4f5f7;--panel:#fff;--text:#111;--muted:#5b6170;--line:#d4d7de;--accent:#0b5cad;--accent-text:#fff;
  --danger:#b3261e;--ok:#1d7a3a;--input:#fff;--chip:#e8eef7;--focus:#ffb300;
  --tap:48px;
}
html[data-theme="dark"]{
  --bg:#0d0f12;--panel:#171a1f;--text:#e9e6df;--muted:#9aa0aa;--line:#2c313a;--accent:#c0392b;--accent-text:#fff;
  --danger:#ff6b5e;--ok:#5fd18a;--input:#0f1215;--chip:#262a31;--focus:#ffb300;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%;padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
button{min-height:var(--tap);min-width:var(--tap);padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:600}
button.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
button.danger{color:var(--danger);border-color:var(--danger)}
button.ghost{background:transparent;border-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--focus);outline-offset:1px}
input,select,textarea{min-height:var(--tap);width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--input)}
textarea{resize:vertical;min-height:72px}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:0 0 4px}
.wrap{max-width:1100px;margin:0 auto;padding:12px}
header.bar{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
header.bar .wrap{display:flex;gap:8px;align-items:center;padding:8px 12px}
header.bar h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;max-width:1100px;margin:0 auto}
nav.tabs button{flex:0 0 auto}
nav.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.card h2{font-size:16px;margin:0 0 10px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.row>*{flex:1 1 auto}
.muted{color:var(--muted)}
.small{font-size:13px}
.hidden{display:none!important}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600}
.loglist .item{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--panel)}
.loglist .item .info{flex:1;min-width:0;cursor:pointer}
.loglist .item .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qa{position:sticky;top:var(--hdr,64px);z-index:10}
.qa .times{display:grid;grid-template-columns:minmax(0,1fr) 110px auto;gap:8px;align-items:end}
.qa .times>div{min-width:0}
.qa .nowbtn{background:var(--ok);color:#fff;border-color:var(--ok);min-width:90px;font-size:18px}
html[data-theme="dark"] .qa .nowbtn{color:#000}
.qa .addrow{display:flex;gap:8px;margin-top:8px;align-items:stretch}
.qa .addrow textarea{flex:1;min-height:var(--tap)}
.qa .addrow button{min-width:96px;font-size:18px}
.entries .e{display:grid;grid-template-columns:96px 1fr auto;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);align-items:start}
.entries .e .dt{font-variant-numeric:tabular-nums;font-weight:700}
.entries .e .dt small{display:block;font-weight:400;color:var(--muted)}
.entries .e .txt{white-space:pre-wrap;word-break:break-word}
.entries .e .acts{display:flex;gap:4px}
.entries .e .acts button{padding:0 10px}
table.res{width:100%;border-collapse:collapse}
table.res td,table.res th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:middle}
table.res input{min-height:40px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;z-index:100;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--text);max-width:560px;width:92vw;padding:16px}
dialog::backdrop{background:rgba(0,0,0,.5)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--chip);border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-size:28px;font-variant-numeric:tabular-nums}
table.sum{width:100%;border-collapse:collapse;font-size:14px}
table.sum th,table.sum td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left}
table.sum td.n,table.sum th.n{text-align:right;font-variant-numeric:tabular-nums}
table.sum th.sortable{cursor:pointer;user-select:none;white-space:nowrap}
table.sum tbody tr.click{cursor:pointer}
.scroll{overflow-x:auto}
footer.by{text-align:center;color:var(--muted);font-size:12px;padding:16px 0 28px}
.warn{background:#fff3cd;color:#5c4400;border:1px solid #e0c060;border-radius:10px;padding:10px;margin-bottom:12px}
@media (max-width:600px){
  .qa .times{grid-template-columns:minmax(0,1fr) 84px 80px}
  .qa .times input{min-width:0;padding:10px 8px}
  .qa .nowbtn{min-width:0;padding:0 6px}
  .entries .e{grid-template-columns:72px 1fr}
  .entries .e .acts{grid-column:1 / -1;justify-content:flex-end}
  .stats b{font-size:22px}
  header.bar h1{font-size:16px}
}


/* ---------- My Info ---------- */
.mi-dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;margin:0}
.mi-dl dt{color:var(--muted);font-size:13px;font-weight:600}
.mi-dl dd{margin:0;white-space:pre-wrap;word-break:break-word;font-weight:600}
.mi-empty{color:var(--muted);font-style:italic}
.mi-grid{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
@media (max-width:600px){.mi-dl{grid-template-columns:1fr}.mi-dl dd{margin-bottom:6px}}
.tzb{display:inline-block;font-size:11px;font-weight:800;padding:0 5px;border-radius:5px;border:1.5px solid currentColor;margin-left:5px;vertical-align:1px;color:var(--accent)}
.tzb.hidden{display:none!important}
.lastline{margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;color:var(--muted)}
.lastline b{color:var(--text)}
.endrow{display:flex;justify-content:flex-end;margin-top:6px}
.endrow button{min-height:40px;font-size:14px}
html.field .endrow button{min-height:56px;font-size:17px}
#aboutBody{margin:6px 0 0;padding-left:18px;font-size:14px;color:var(--muted)}
#aboutBody li{margin:3px 0}
/* ---------- FIELD MODE: gloves-friendly ---------- */
html.field{--tap:64px}
html.field body{font-size:19px}
html.field label{font-size:15px}
html.field button{font-size:18px;border-width:2px}
html.field .qa .nowbtn{min-width:120px;font-size:24px}
html.field .qa .addrow button{min-width:130px;font-size:24px}
html.field .qa .times{grid-template-columns:minmax(0,1fr) 130px auto}
html.field .qa .addrow textarea{min-height:96px;font-size:20px}
html.field input,html.field select,html.field textarea{font-size:19px}
html.field input[type="checkbox"]{width:30px!important;height:30px!important;min-height:30px!important}
html.field .entries .e .acts button{min-width:64px;padding:0 14px}
html.field nav.tabs button{font-size:17px}
@media (max-width:600px){
  html.field .qa .times{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  html.field .qa .times>div:first-child{grid-column:1 / -1}
  html.field .qa .nowbtn{min-width:0;font-size:22px}
  html.field .qa .addrow{flex-direction:column}
  html.field .qa .addrow button{min-height:72px;width:100%}
  html.field .entries .e{grid-template-columns:80px 1fr}
}
.toggle{display:flex;gap:12px;align-items:flex-start;margin:10px 0;font-weight:600;color:var(--text);font-size:16px}
.toggle input{width:26px;height:26px;min-height:26px;flex:0 0 auto;margin-top:2px}
.toggle.sub{margin-left:38px}
.toggle.sub.off{opacity:.45}
.gps .pin,.small .pin{vertical-align:-1px;margin-right:3px}.entries .e .gps{display:block;margin-top:2px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.toggle .small{display:block;font-weight:400;color:var(--muted)}
.beta{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.06em;padding:0 5px;border-radius:5px;border:1.5px solid currentColor;margin-left:6px;vertical-align:2px;color:var(--accent);line-height:1.5}
/* last-event ticker: very top of the app, one line */
.ticker{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;line-height:20px;padding:3px 12px;color:var(--muted);border-bottom:1px solid var(--line);max-width:1100px;margin:0 auto}
.ticker b{color:var(--text)}
html.field .ticker{font-size:16px;line-height:24px}

/* ---------- T-card board ---------- */
.fbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.fbar select{width:auto;min-width:150px;flex:0 1 auto}
.fbar input[type=search]{flex:1 1 180px;width:auto}
.fbar .cnt{font-size:13px;font-weight:700;background:var(--chip);border-radius:999px;padding:4px 12px;white-space:nowrap}
.board{display:grid;gap:10px;grid-template-columns:repeat(var(--cols,4),minmax(200px,1fr));overflow-x:auto;align-items:start}
.col{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;min-height:120px}
.col.over{outline:3px dashed var(--accent);outline-offset:-3px;background:var(--chip)}
.col h3 .sd{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:1px solid rgba(0,0,0,.3)}
.col h3{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:0 0 8px;font-size:15px}
.col h3 b{font-size:22px;font-variant-numeric:tabular-nums}
.col h3 .u{font-size:12px;font-weight:600;color:var(--muted)}
.col .empty{color:var(--muted);font-size:13px;font-style:italic;padding:6px 2px}
.tile{--tc:#fff;--tt:#000;--cc:#999;background:var(--tc);color:var(--tt);border:1px solid rgba(0,0,0,.25);border-top:6px solid var(--cc);border-radius:10px;padding:8px 10px;margin:0 0 8px;cursor:pointer;-webkit-user-select:none;user-select:none;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tile:focus-visible{outline:3px solid var(--focus);outline-offset:1px}
.tile .tl1{display:flex;justify-content:space-between;gap:6px;font-weight:800;font-size:16px}
.tile .tl1 span{font-weight:700;white-space:nowrap}
.tile .tl2{font-size:13px;font-weight:600;opacity:.85}
.tile .tl3{font-size:13px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile{border-left:6px solid var(--sc,#999);position:relative;touch-action:manipulation}
.tile .sid{font-size:12px;font-weight:800;background:rgba(255,255,255,.6);color:#000;border-radius:5px;padding:0 5px;margin-right:6px}
.tile .tl1 b{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .grip{position:absolute;right:2px;bottom:2px;width:34px;height:34px;display:grid;place-items:center;font-size:18px;opacity:.6;touch-action:none;cursor:grab}
.tile,.mk{-webkit-touch-callout:none}
.tile.held{outline:3px solid var(--accent);outline-offset:1px}
.tile .tl3,.tile .tl2{padding-right:30px}
.tile.dragging,.mk.dragging{opacity:.35}
.dghost{position:fixed;left:0;top:0;z-index:999;pointer-events:none;box-shadow:0 10px 24px rgba(0,0,0,.35)!important;transform-origin:center;opacity:.95}
.tile.dghost{transform:rotate(2deg)}
.bvseg{margin:0 0 10px}
#mapArea{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;touch-action:pan-x pan-y;min-height:200px}
#mapArea.nomap{aspect-ratio:4/3;background-color:#f7f7f2;background-image:linear-gradient(#ddd 1px,transparent 1px),linear-gradient(90deg,#ddd 1px,transparent 1px);background-size:10% 10%}
#mapArea img{display:block;width:100%;height:auto;-webkit-user-drag:none;user-select:none;pointer-events:none}
#mapArea.over,#mapTray.over{outline:3px dashed var(--accent);outline-offset:-3px}
.mk{position:absolute;transform:translate(-50%,-50%);background:var(--tc);color:var(--tt);border:3px solid var(--sc);border-radius:8px;padding:2px 6px;font-size:12px;font-weight:800;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.mk.dghost{transform:translate(-50%,-50%)}
.tray{display:flex;flex-wrap:wrap;gap:8px;min-height:70px;border:1px dashed var(--line);border-radius:12px;padding:8px;margin-top:6px}
.tray .tile{margin:0;flex:0 1 220px}
.mapnote{font-size:13px;color:var(--muted);margin:6px 0}
.strow input[type=color]{flex:0 0 48px;width:48px;padding:2px}
@media (max-width:700px){.board{grid-template-columns:1fr}}
html.field .tile{padding:12px;font-size:18px}
html.field .tile .tl1{font-size:20px}
/* swatches, palette, previews */
.sw{display:inline-block;width:22px;height:22px;border-radius:6px;border:1px solid rgba(0,0,0,.35);vertical-align:middle;flex:0 0 auto}
.pal{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.pal button{min-height:36px;min-width:36px;padding:0;border-radius:8px;border:1px solid rgba(0,0,0,.35)}
.pal button[aria-pressed="true"]{outline:3px solid var(--focus);outline-offset:1px}
.cprev{border-radius:10px;padding:10px;border:1px solid rgba(0,0,0,.25);font-weight:700;margin-top:8px}
.nightnote{display:none;color:var(--muted);font-size:13px;margin:4px 0}
.ehead{border-radius:10px;padding:8px 12px;margin:0 0 12px;border:1px solid rgba(0,0,0,.25);border-top:6px solid var(--cc,#999);font-weight:700}
.ehead small{display:block;font-weight:600;opacity:.8}
.cats .cat{border:1px solid var(--line);border-radius:12px;padding:10px;margin:0 0 10px}
.cats .crow{display:flex;gap:10px;align-items:center;padding:4px 0}
.cats .crow .nm{flex:1 1 auto;min-width:0;font-weight:700}
.cats .crow .nm small{font-weight:500;color:var(--muted)}
.cats .trow{margin-left:22px;border-top:1px solid var(--line)}
.cats .trow .nm{font-weight:600}
.cats .crow button{min-height:40px;padding:0 12px}
.strow{display:flex;gap:6px;align-items:center;margin:0 0 6px}
.strow input{flex:1 1 auto}
.strow button{min-width:44px;padding:0 10px;flex:0 0 auto}
table.hist{width:100%;border-collapse:collapse;font-size:14px}
table.hist th,table.hist td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
table.hist td.dt{white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:700}
.sbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:12px 0 0}
.sbtns button[aria-pressed="true"]{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.seg{display:inline-flex;gap:0}
.seg button{border-radius:0}
.seg button:first-child{border-radius:10px 0 0 10px}
.seg button:last-child{border-radius:0 10px 10px 0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.plist{max-height:50vh;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:4px 8px;margin:8px 0}
.plist label.pi{display:flex;gap:10px;align-items:center;font-size:15px;font-weight:600;color:var(--text);margin:0;padding:6px 0;border-bottom:1px solid var(--line)}
.plist label.pi:last-child{border-bottom:none}
.plist label.pi input{width:24px;height:24px;min-height:24px;flex:0 0 auto}
.plist label.pi small{color:var(--muted);font-weight:500}
.cwsub{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;margin:0 0 10px 38px}
.cwsub label{margin:0;font-size:14px}
.cwsub input[type=range]{width:100%;min-height:32px;padding:0}
/* Easter egg menu (About) */
#aboutVer{cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#eggMenu{margin-top:12px;padding:10px 12px;border:1px dashed var(--line);border-radius:12px}
#eggMenu h3{margin:0 0 4px;font-size:14px}
#eggMenu .toggle{margin:8px 0}
#eggMenu .eggfoot{display:flex;justify-content:flex-end}
#eggHide{color:var(--accent);font-size:13px;font-weight:600;background:none;border:none;min-height:32px;min-width:0;padding:0 4px;text-decoration:underline;cursor:pointer}

/* ---------- EASTER EGG MODES: screen only, never print ---------- */
@media screen{
  /* Waterfall: SDR spectrum waterfall scrolling behind the board */
  html[data-egg="waterfall"]{--bg:#030718;--panel:#0a1430;--text:#e8f1ff;--muted:#9fb3d6;--line:#22396c;--accent:#22c7ff;--accent-text:#03101f;--danger:#ff7b6b;--ok:#3ee08f;--input:#06102a;--chip:#13224a;--focus:#ffe14a;color-scheme:dark}
  html[data-egg="waterfall"] body{background:#030718}
  html[data-egg="waterfall"] body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.55;
    background-image:repeating-linear-gradient(180deg,rgba(3,7,24,0) 0 3px,rgba(3,7,24,.55) 3px 5px,rgba(3,7,24,0) 5px 9px),
      linear-gradient(90deg,#020a3c 0%,#05207e 12%,#0b5fe0 19%,#ffe14a 21.5%,#ff4a1f 22.5%,#ffe14a 23.5%,#0b5fe0 26%,#05207e 38%,#0a3fb8 52%,#36e0ff 55%,#0a3fb8 58%,#05207e 70%,#0b5fe0 81%,#b8ff4a 83%,#0b5fe0 85%,#020a3c 100%);
    background-size:100% 36px,100% 100%;animation:wfall 1.6s linear infinite}
  @keyframes wfall{from{background-position:0 0,0 0}to{background-position:0 36px,0 0}}
  html[data-egg="waterfall"] header.bar{background:#050c24;border-bottom:2px solid transparent;border-image:linear-gradient(90deg,#05207e,#0b5fe0,#ffe14a,#ff4a1f,#ffe14a,#0b5fe0,#36e0ff,#05207e) 1}
  html[data-egg="waterfall"] header.bar h1::before{content:"\301C  ";color:#ffe14a}
  html[data-egg="waterfall"] .ticker{background:#050c24;color:#9fb3d6;border-bottom-color:#22396c}
  html[data-egg="waterfall"] .card,html[data-egg="waterfall"] .col{background:rgba(10,20,48,.92);border-color:#22396c;box-shadow:0 0 0 1px rgba(34,199,255,.08),0 4px 18px rgba(0,0,0,.45)}
  html[data-egg="waterfall"] .tile{box-shadow:0 0 10px rgba(54,224,255,.35)}
  html[data-egg="waterfall"] button{background:#0a1430;border-color:#2b4a8a}
  html[data-egg="waterfall"] button.primary,html[data-egg="waterfall"] .seg button[aria-pressed="true"],html[data-egg="waterfall"] .sbtns button[aria-pressed="true"]{background:#22c7ff;color:#03101f;border-color:#22c7ff}
  html[data-egg="waterfall"] button.ghost{background:transparent;border-color:transparent}
  html[data-egg="waterfall"] .col h3 b{color:#ffe14a}
  /* QSL card: tiles become QSL postcards on a cardstock desk */
  html[data-egg="qsl"]{--bg:#efe5cc;--panel:#fffaf0;--text:#2b1d10;--muted:#6b5537;--line:#d2bf93;--accent:#a3201c;--accent-text:#fff;--danger:#a3201c;--ok:#2d6b2d;--input:#fffdf6;--chip:#f3e6c4;--focus:#1e5aa8}
  html[data-egg="qsl"] body{background:repeating-linear-gradient(45deg,#efe5cc 0 14px,#ebe0c3 14px 28px)}
  html[data-egg="qsl"] header.bar{background:#fffaf0;border-bottom:3px double #a3201c}
  html[data-egg="qsl"] header.bar h1{font-family:Georgia,"Times New Roman",serif;color:#a3201c;letter-spacing:.02em}

.msheet table{width:100%;border-collapse:collapse}

.cm.h{height:.6pt;width:.3in}.cm.v{width:.6pt;height:.12in}

.bsheet{width:7.7in;background:#fff;color:#000;font-family:Arial,Helvetica,sans-serif;font-size:9pt}
.bsheet h1{font-size:15pt;margin:0 0 2px}
.bsheet .meta{display:grid;grid-template-columns:1fr 1fr;gap:2px 14px;margin:4px 0 6px;font-size:9pt}
.bsheet .meta b{font-family:"Courier New",monospace}

.bsheet .kpis div{flex:1;border:1.5px solid #000;padding:4px;text-align:center;font-size:8pt}
.bsheet .kpis b{display:block;font-size:16pt}
.bsheet h2{font-size:10.5pt;margin:10px 0 4px;border-bottom:1.5px solid #000;break-after:avoid}
.bsheet table{width:100%;border-collapse:collapse}
.bsheet td,.bsheet th{border:1px solid #777;padding:2px 4px;text-align:left;font-size:8.5pt;vertical-align:top}
.bsheet th{background:#eee}
.bsheet tr{break-inside:avoid}
.bsheet .bsw{display:inline-block;width:10px;height:10px;border:1px solid #000;margin-right:4px;vertical-align:-1px}
.bsheet .foot{margin-top:8px;font-size:7.5pt;color:#444}
@page{size:letter portrait;margin:0.2in}
@media print{
  html,html[data-theme]{color-scheme:light!important}
  html,body{background:#fff!important;color:#000!important}
  body>*:not(#printRoot){display:none!important}
  body::before,body::after{display:none!important}
  .noprint{display:none!important}
  #printRoot{position:static;left:auto;visibility:visible}
  .tpage{break-after:page;page-break-after:always}
  .tpage:last-child{break-after:auto;page-break-after:auto}
  .spage,.cpage{break-after:page;page-break-after:always}
  .cpage:last-child{break-after:auto;page-break-after:auto}
  .spage:last-child{break-after:auto;page-break-after:auto}
  .msheet{margin:.2in .2in 0}
  .bsheet{margin:.2in .2in 0}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
